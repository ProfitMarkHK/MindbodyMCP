# Bun configuration

[install]
# Use the Bun lockfile format
lockfile.save = true

[run]
# Enable hot reloading in development
hot = true

[test]
# Test configuration
coverage = true
# UNITS: Bun 1.4.0 reads this as a FRACTION (0.0-1.0), not a percentage, and
# enforces it PER FILE, not against the aggregate row. So `80` means 8000% and
# every run fails — a dead gate, not a strict one. Measured on 2026-10-19 against
# this suite: `80`, `1` and `0.50` all exit non-zero; `0.10` and `0.01` exit 0.
# The binding figure here is `src/api/auth.ts` at 11.25% lines / 16.67% funcs, and
# this value sits just under it. Read the units before changing this number; see
# Gate 1 in docs/quality-gates.md.
coverageThreshold = 0.10

# Runtime configuration
[runtime]
# Use Bun's built-in .env loader
dotenv = true
