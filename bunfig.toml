# Bun configuration

[install]
# Use the Bun lockfile format
lockfile.save = true

[run]
# Enable hot reloading in development
hot = true

[test]
# Test configuration
# Discover tests only under ./tests. A bare `bun test` otherwise walks the whole
# working tree, so any sibling git worktree or scratch checkout nested inside the
# repo root is collected as another copy of the suite: duplicate GATE2/GATE13
# sentinels with different counts, and a stale copy can fail this checkout's
# gate. Bun does NOT honour .gitignore for test discovery, so this setting is the
# only thing that scopes it. Explicit paths still work (e.g. the opt-in live tier,
# `bun test ./tests/live/mindbody-live.e2e.ts`).
root = "./tests"
coverage = true
# Fraction (0.0-1.0), enforced per file against BOTH % Funcs and % Lines.
# 0.10 is the measured floor, not a percentage: 80 meant 8000% and could never
# pass. See docs/quality-gates.md, Gate 1, before changing this number.
coverageThreshold = 0.10

# Runtime configuration
[runtime]
# Use Bun's built-in .env loader
dotenv = true
