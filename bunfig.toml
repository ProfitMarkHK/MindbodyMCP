# Bun configuration

[install]
# Use the Bun lockfile format
lockfile.save = true

[run]
# Enable hot reloading in development
hot = true

[test]
# Test configuration
coverage = true
# UNITS: Bun 1.4.0 reads this as a FRACTION (0.0-1.0), not a percentage, and
# enforces it PER FILE against BOTH % Funcs and % Lines — not against the
# aggregate row. So `80` means 8000% and no run could ever satisfy it (a dead
# gate, not a strict one), and `40` would mean 4000%. The value below is the
# measured per-file floor. Read the units before changing this number; see Gate 1
# in docs/quality-gates.md.
coverageThreshold = 0.10

# Runtime configuration
[runtime]
# Use Bun's built-in .env loader
dotenv = true
