name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Least privilege: this workflow only reads the repo. Without this block the
# GITHUB_TOKEN inherits the repository default (often contents: write).
permissions:
  contents: read

jobs:
  # Documentation-only changes skip the jobs below, matching the pre-commit
  # hook. The skip is a job-level `if`, not a trigger `paths-ignore`, so the
  # workflow always runs and every job reports a result: a skipped job counts
  # as passing a required status check, while a workflow that never started
  # leaves the check pending forever. Docs means *.md and LICENSE only;
  # docs/openapi.json is code here because Gates 13 and 16 read it.
  # See "Run everything" in docs/quality-gates.md.
  changes:
    name: Detect docs-only change
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: bash scripts/ci-code-changed.sh >> "$GITHUB_OUTPUT"

  test-bun:
    name: Test with Bun
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
          
      - name: Install dependencies
        run: bun install
        
      - name: Run type checking
        run: bunx tsc --noEmit
        
      - name: Run tests
        run: bun test
        
      # Known gap: there is no gate that exercises the tool layer end to end
      # (calling a tool against the Mindbody API). It needs credentials, so it
      # cannot run here. Tracked for a future end-to-end gate.
      - name: Build check
        run: bun run src/index.ts --help

  test-node:
    name: Test with Node.js
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          
      - name: Install dependencies
        run: |
          npm install --package-lock-only
          npm ci
        
      - name: Run type checking
        run: npx tsc --noEmit
        
      - name: Build
        run: npm run node:build
        
      - name: Test build output
        run: node dist/index.js --help

  validate-mcp:
    name: Validate MCP Server
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
          
      - name: Install dependencies
        run: bun install
        
      # No standalone schema-validation step is needed here. Gate 2
      # (tests/e2e-mcp-server.test.ts) spawns the real src/index.ts over
      # STDIO and asserts against the inputSchemas the server actually
      # advertises over MCP JSON-RPC: each parses as a valid JSON Schema,
      # is type "object", declares every `required` field inside
      # `properties`, and types every property. That is the replacement for
      # the old validate-mcp step, whose exit code came from `head` rather
      # than from the server. The steps below check the environment template
      # exists and that the types compile.
      - name: Check environment template
        run: |
          if [ ! -f ".env.example" ]; then
            echo "Error: .env.example file missing"
            exit 1
          fi
          
      - name: Validate TypeScript types
        run: bunx tsc --noEmit

  security:
    name: Security Scan
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run security audit
        run: npm audit --audit-level=moderate
        
      - name: Check for secrets
        run: bash scripts/secret-scan.sh