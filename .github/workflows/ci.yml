name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Least privilege: this workflow only reads the repo. Without this block the
# GITHUB_TOKEN inherits the repository default (often contents: write).
permissions:
  contents: read

jobs:
  test-bun:
    name: Test with Bun
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          
      - name: Install dependencies
        run: bun install
        
      - name: Run type checking
        run: bunx tsc --noEmit
        
      - name: Run tests
        run: bun test
        
      # Known gap: there is no gate that exercises the tool layer end to end
      # (calling a tool against the Mindbody API). It needs credentials, so it
      # cannot run here. Tracked for a future end-to-end gate.
      - name: Build check
        run: bun run src/index.ts --help

  test-node:
    name: Test with Node.js
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          
      - name: Install dependencies
        run: |
          npm install --package-lock-only
          npm ci
        
      - name: Run type checking
        run: npx tsc --noEmit
        
      - name: Build
        run: npm run node:build
        
      - name: Test build output
        run: node dist/index.js --help

  validate-mcp:
    name: Validate MCP Server
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          
      - name: Install dependencies
        run: bun install
        
      # No standalone schema-validation step is needed here. Gate 2
      # (tests/e2e-mcp-server.test.ts) spawns the real src/index.ts over
      # STDIO and asserts against the inputSchemas the server actually
      # advertises over MCP JSON-RPC: each parses as a valid JSON Schema,
      # is type "object", declares every `required` field inside
      # `properties`, and types every property. That is the replacement for
      # the old validate-mcp step, whose exit code came from `head` rather
      # than from the server. The steps below check the environment template
      # exists and that the types compile.
      - name: Check environment template
        run: |
          if [ ! -f ".env.example" ]; then
            echo "Error: .env.example file missing"
            exit 1
          fi
          
      - name: Validate TypeScript types
        run: bunx tsc --noEmit

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run security audit
        run: npm audit --audit-level=moderate
        
      - name: Check for secrets
        run: bash scripts/secret-scan.sh