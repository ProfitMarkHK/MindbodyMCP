name: Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 2.0.0)'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  # Single gate for everything that publishes. Previously the secret scan was a
  # step inside each publish job, so if publish-npm failed on a secret the other
  # three carried on and published anyway - and nothing ever checked that the
  # version in package.json was the version being released.
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan
        run: bash scripts/secret-scan.sh

      - name: Verify version matches tag
        env:
          # On release: the tag (e.g. v2.0.3). On workflow_dispatch: the input.
          EXPECTED_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          set -euo pipefail
          expected="${EXPECTED_VERSION#v}"
          actual="$(jq -r '.version' package.json)"

          if [ -z "$expected" ]; then
            echo "::error::No release tag or version input found to validate against."
            exit 1
          fi

          if [ "$actual" != "$expected" ]; then
            echo "::error::Version mismatch: package.json says '$actual' but this release is '$expected'."
            echo "Update package.json to $expected before publishing. This job will not rewrite it for you."
            exit 1
          fi

          echo "Version $actual matches the release. Preflight passed."

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: preflight
    
    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets
        run: bash scripts/secret-scan.sh
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run node:build
        
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          
  publish-github:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: preflight
    
    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets
        run: bash scripts/secret-scan.sh
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@vespo92'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run node:build
        
      - name: Configure package.json for GitHub
        run: |
          npm pkg set name="@vespo92/mindbody-mcp"
          npm pkg set publishConfig.registry="https://npm.pkg.github.com"
          
      - name: Publish to GitHub Packages
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-bun:
    name: Create Bun executable
    runs-on: ubuntu-latest
    needs: preflight
    
    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets
        run: bash scripts/secret-scan.sh
      
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          
      - name: Install dependencies
        run: bun install
        
      - name: Create standalone executable
        run: |
          bun build src/index.ts --compile --outfile mindbody-mcp
          tar -czf mindbody-mcp-bun.tar.gz mindbody-mcp
          
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: mindbody-mcp-bun
          path: mindbody-mcp-bun.tar.gz

  create-docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: preflight
    
    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets
        run: bash scripts/secret-scan.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/vespo92/mindbody-mcp:latest
            ghcr.io/vespo92/mindbody-mcp:${{ github.event.release.tag_name || github.event.inputs.version }}